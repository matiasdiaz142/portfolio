<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================= -->
    <!-- FAVICON — reemplazá /favicon.svg por tu ícono  -->
    <!-- (colocar el archivo dentro de /public)          -->
    <!-- ============================================= -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect para acelerar la carga de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ============================================= -->
    <!-- SEO BÁSICO                                     -->
    <!-- Reemplazá [Tu Nombre] y ajustá la descripción  -->
    <!-- ============================================= -->
    <title>Matias Diaz | Desarrollador de Software</title>
    <meta
      name="description"
      content="Portfolio de Matias Diaz, Desarrollador de Software y Técnico Universitario en Programación (UNAHUR). Proyectos, stack técnico y experiencia en desarrollo Full Stack."
    />
    <meta
      name="keywords"
      content="desarrollador de software, programador, full stack, UNAHUR, portfolio, react, javascript"
    />
    <meta name="author" content="Matias Diaz" />

    <!-- Color de la barra del navegador en mobile (coincide con el fondo dark) -->
    <meta name="theme-color" content="#020617" />

    <!-- ============================================= -->
    <!-- URL CANÓNICA                                   -->
    <!-- Reemplazá por la URL real una vez deployado    -->
    <!-- ============================================= -->
    <link rel="canonical" href="https://tu-portfolio.vercel.app/" />

    <!-- ============================================= -->
    <!-- OPEN GRAPH (Facebook, LinkedIn, WhatsApp, etc) -->
    <!-- ============================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tu-portfolio.vercel.app/" />
    <meta property="og:title" content="Matias Diaz | Desarrollador de Software" />
    <meta
      property="og:description"
      content="Portfolio de Matias Diaz, Desarrollador de Software y Técnico Universitario en Programación (UNAHUR). Proyectos, stack técnico y experiencia en desarrollo Full Stack."
    />
    <!-- ============================================= -->
    <!-- IMAGEN DE PREVISUALIZACIÓN (og-image)          -->
    <!-- Tamaño recomendado: 1200x630px, formato PNG/JPG -->
    <!-- Colocar el archivo en /public/og-image.png      -->
    <!-- ============================================= -->
    <meta property="og:image" content="https://tu-portfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />

    <!-- ============================================= -->
    <!-- TWITTER / X CARDS                              -->
    <!-- ============================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tu-portfolio.vercel.app/" />
    <meta name="twitter:title" content="Matias Diaz | Desarrollador de Software" />
    <meta
      name="twitter:description"
      content="Portfolio de Matias Diaz, Desarrollador de Software y Técnico Universitario en Programación (UNAHUR)."
    />
    <!-- Misma imagen que og:image, reutilizada para Twitter -->
    <meta name="twitter:image" content="https://tu-portfolio.vercel.app/og-image.png" />
    <!-- Opcional: agregá tu usuario de Twitter/X si tenés uno -->
    <!-- <meta name="twitter:creator" content="@tu_usuario" /> -->

    <!-- ============================================= -->
    <!-- ROBOTS — permite indexación completa           -->
    <!-- ============================================= -->
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
